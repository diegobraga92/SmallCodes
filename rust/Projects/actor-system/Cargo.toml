[package]
name = "actor-system"
version = "0.1.0"
edition = "2021"
description = "Actor-based concurrency demo using Tokio — for studying JD requirements"

[dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
