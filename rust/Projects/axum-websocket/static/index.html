<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #16213e;
            border-radius: 12px;
            padding: 24px;
            width: 500px;
            max-width: 90vw;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 16px;
            color: #0f3460;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            font-size: 0.85rem;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #e74c3c;
            transition: background 0.3s;
        }
        .status-dot.connected { background: #2ecc71; }
        .messages {
            background: #0f3460;
            border-radius: 8px;
            padding: 12px;
            height: 300px;
            overflow-y: auto;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }
        .messages .msg {
            padding: 6px 10px;
            margin-bottom: 4px;
            background: #1a1a2e;
            border-radius: 6px;
            word-break: break-word;
        }
        .messages .msg.system {
            color: #95a5a6;
            font-style: italic;
            background: transparent;
        }
        .input-row {
            display: flex;
            gap: 8px;
        }
        input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #0f3460;
            border-radius: 8px;
            background: #0f3460;
            color: #e0e0e0;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #e94560; }
        input::placeholder { color: #7f8c8d; }
        button {
            padding: 10px 20px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        button:hover { background: #c0392b; }
        button:disabled {
            background: #7f8c8d;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💬 WebSocket Chat</h1>
        <div class="status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Disconnected</span>
        </div>
        <div class="messages" id="messages"></div>
        <div class="input-row">
            <input type="text" id="messageInput" placeholder="Type a message..." disabled>
            <button id="sendBtn" disabled>Send</button>
        </div>
    </div>

    <script>
        const wsUrl = `ws://${location.host}/ws`;
        let ws = null;
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        function addMessage(text, isSystem = false) {
            const div = document.createElement('div');
            div.className = `msg${isSystem ? ' system' : ''}`;
            div.textContent = text;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function setConnected(connected) {
            statusDot.className = `status-dot${connected ? ' connected' : ''}`;
            statusText.textContent = connected ? 'Connected' : 'Disconnected';
            inputEl.disabled = !connected;
            sendBtn.disabled = !connected;
        }

        function connect() {
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                setConnected(true);
                addMessage('Connected to chat server', true);
            };

            ws.onmessage = (event) => {
                addMessage(event.data);
            };

            ws.onclose = () => {
                setConnected(false);
                addMessage('Disconnected from server', true);
                // Auto-reconnect after 2 seconds
                setTimeout(connect, 2000);
            };

            ws.onerror = (err) => {
                console.error('WebSocket error:', err);
                addMessage('Connection error', true);
            };
        }

        function sendMessage() {
            const text = inputEl.value.trim();
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
            ws.send(text);
            inputEl.value = '';
        }

        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        sendBtn.addEventListener('click', sendMessage);

        // Connect on page load
        connect();
    </script>
</body>
</html>
