[package]
name = "axum-websocket"
version = "0.1.0"
edition = "2021"
description = "Axum WebSocket chat server — real-time bidirectional communication"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = "0.5"
