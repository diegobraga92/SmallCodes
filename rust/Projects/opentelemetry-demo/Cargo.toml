[package]
name = "opentelemetry-demo"
version = "0.1.0"
edition = "2021"
description = "OpenTelemetry observability demo — tracing, metrics, and structured logging"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.28"
opentelemetry = { version = "0.27", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.27", features = ["trace", "metrics", "rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["trace", "metrics", "grpc-tonic"] }
tonic = "0.12"
prost = "0.13"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = "0.5"
