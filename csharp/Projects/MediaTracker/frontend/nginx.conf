/*
 * Nginx configuration for serving the React frontend and proxying API requests.
 *
 * Nginx is a high-performance web server and reverse proxy. In this setup:
 * 1. It serves the built React static files (HTML, JS, CSS)
 * 2. It proxies /api/* requests to the .NET backend
 * 3. It handles SPA routing (any non-file request returns index.html)
 *
 * Why Nginx instead of serving directly with Node.js?
 * - Nginx is much more efficient at serving static files
 * - Nginx handles reverse proxying, load balancing, SSL termination
 * - The React dev server (Vite) is only for development
 * - In production, you always use a proper web server like Nginx
 */

server {
    listen 80;
    server_name localhost;

    /*
     * Serve static files from the built React app.
     * root: the directory where the built files are located
     * index: the default file to serve for directory requests
     *
     * The try_files directive:
     * 1. Try the exact URI as a file ($uri)
     * 2. If not found, try the URI as a directory ($uri/)
     * 3. If neither exists, serve index.html (for SPA routing)
     *
     * This is the "SPA fallback" — React Router handles routing on the client side.
     * Without this, refreshing /media/123 would return 404 because Nginx
     * doesn't know about React Router routes.
     */
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    /*
     * Proxy API requests to the backend.
     *
     * The location /api/ block matches any request starting with /api/.
     * These requests are forwarded to the backend service at http://api:5000.
     *
     * In Docker Compose, services can reach each other by service name.
     * "api" resolves to the API container's IP address.
     *
     * The trailing slash in proxy_pass (http://api:5000/) strips the /api prefix.
     * So /api/media becomes http://api:5000/media.
     * Without the trailing slash, it would become http://api:5000/api/media.
     *
     * proxy_set_header directives forward the original client information:
     * - Host: the original Host header
     * - X-Real-IP: the client's real IP
     * - X-Forwarded-For: chain of proxies the request went through
     * - X-Forwarded-Proto: the original protocol (http or https)
     */
    location /api/ {
        proxy_pass http://api:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
